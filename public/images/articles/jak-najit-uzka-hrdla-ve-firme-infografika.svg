<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Cena úzkého hrdla"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091726"/><stop offset="1" stop-color="#123147"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#67d5f5" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="44" y="40" width="1112" height="595" rx="28" fill="#11263a" stroke="#2f5068"/><text x="78" y="98" fill="#67d5f5" font-size="20" font-family="Arial,sans-serif" font-weight="bold">PROCELYX · MAPA PROCESU</text><text x="78" y="159" fill="#f3f8ff" font-size="38" font-family="Arial,sans-serif" font-weight="bold">Cena úzkého hrdla</text><text x="78" y="196" fill="#a7c2d5" font-size="21" font-family="Arial,sans-serif">Čas práce, čekání a přímé náklady sledujte odděleně.</text><path d="M125 278H333M333 278H508M508 278H696M696 278H890" stroke="#67d5f5" stroke-width="4" marker-end="url(#arrow)"/><g font-family="Arial" text-anchor="middle"><rect x="89" y="250" width="210" height="124" rx="18" fill="#194d6a"/><text x="194" y="299" fill="white" font-size="25" font-weight="bold">20 výskytů</text><text x="194" y="340" fill="#b6d8e8" font-size="19">za měsíc</text><rect x="342" y="250" width="210" height="124" rx="18" fill="#296a76"/><text x="447" y="299" fill="white" font-size="25" font-weight="bold">15 minut</text><text x="447" y="340" fill="#b6d8e8" font-size="19">ruční opravy</text><rect x="598" y="250" width="210" height="124" rx="18" fill="#1c766e"/><text x="703" y="299" fill="white" font-size="25" font-weight="bold">5 hodin</text><text x="703" y="340" fill="#b6d8e8" font-size="19">aktivní práce</text><rect x="850" y="250" width="258" height="124" rx="18" fill="#9a5134"/><text x="979" y="299" fill="white" font-size="25" font-weight="bold">2 dny čekání</text><text x="979" y="340" fill="#f1c5ad" font-size="19">na jednu poptávku</text></g><path d="M703 382V445M979 382V445" stroke="#7faac1" stroke-width="3"/><rect x="548" y="447" width="545" height="95" rx="16" fill="#223a4d" stroke="#50758b"/><text x="576" y="485" fill="#f3f8ff" font-size="22" font-family="Arial">Ptejte se na příčinu: chybějící podklad,</text><text x="576" y="517" fill="#f3f8ff" font-size="22" font-family="Arial">nejasný vlastník, nebo ztracená verze?</text><text x="85" y="605" fill="#8eacbf" font-size="16" font-family="Arial">Ilustrační výpočet: 20 × 15 minut = 5 hodin. Čekání se k hodinám práce nepřičítá.</text></svg>