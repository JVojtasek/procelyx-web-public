<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Práce versus čekání"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091726"/><stop offset="1" stop-color="#123147"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#67d5f5" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="44" y="40" width="1112" height="595" rx="28" fill="#11263a" stroke="#2f5068"/><text x="78" y="98" fill="#67d5f5" font-size="20" font-family="Arial,sans-serif" font-weight="bold">PROCELYX · MAPA PROCESU</text><text x="78" y="159" fill="#f3f8ff" font-size="38" font-family="Arial,sans-serif" font-weight="bold">Práce versus čekání</text><text x="78" y="196" fill="#a7c2d5" font-size="21" font-family="Arial,sans-serif">Stejná zakázka může být rychle hotová, ale dlouho předaná.</text><text x="84" y="265" fill="#bcd3e2" font-size="24" font-family="Arial">Poptávka</text><text x="1000" y="265" fill="#bcd3e2" font-size="24" font-family="Arial">Předání</text><path d="M195 258H975" stroke="#67d5f5" stroke-width="4" marker-end="url(#arrow)"/><rect x="85" y="310" width="185" height="104" rx="15" fill="#176c80"/><text x="100" y="355" fill="white" font-size="19" font-family="Arial" font-weight="bold">AKTIVNÍ PRÁCE</text><text x="118" y="389" fill="white" font-size="25" font-family="Arial">90 minut</text><rect x="290" y="310" width="552" height="104" rx="15" fill="#a35332"/><text x="325" y="355" fill="white" font-size="23" font-family="Arial" font-weight="bold">ČEKÁNÍ NA PODKLADY / SCHVÁLENÍ</text><text x="325" y="389" fill="white" font-size="25" font-family="Arial">4 dny</text><rect x="862" y="310" width="240" height="104" rx="15" fill="#176c80"/><text x="888" y="355" fill="white" font-size="23" font-family="Arial" font-weight="bold">DALŠÍ PRÁCE</text><text x="888" y="389" fill="white" font-size="25" font-family="Arial">3 hodiny</text><text x="85" y="504" fill="#d7e8f2" font-size="27" font-family="Arial">Zrychlit pouze první krok nestačí.</text><text x="85" y="547" fill="#67d5f5" font-size="26" font-family="Arial" font-weight="bold">Změřte, kde zakázka stojí mezi kroky.</text><text x="85" y="605" fill="#8eacbf" font-size="16" font-family="Arial">Ilustrační příklad. Časy nejsou výsledkem konkrétního klienta.</text></svg>